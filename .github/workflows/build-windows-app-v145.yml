name: Build RJP Signer Windows App V1.4.5 NO PUBLISH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-app-no-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Run smoke tests
        shell: pwsh
        run: npm test

      - name: Build Web UI
        shell: pwsh
        run: npm run build

      - name: Build Bridge Release x64
        shell: pwsh
        run: msbuild bridge/RJP.Signer.Bridge/RJP.Signer.Bridge.csproj /restore /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Verify NO PUBLISH configuration
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.scripts.'windows:package' -notmatch '--publish never') { throw 'windows:package must contain --publish never' }
          Write-Host 'NO PUBLISH guard OK'

      - name: Build Windows desktop setup NO PUBLISH
        shell: pwsh
        run: npm run windows:package

      - name: Read project version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $source = "release-windows/win-unpacked/*"
          $dest = "release-windows/RJP_Signer_Windows_Portable_${version}_x64.zip"
          if (!(Test-Path "release-windows/win-unpacked")) { throw "win-unpacked não foi criado" }
          Compress-Archive -Path $source -DestinationPath $dest -Force

      - name: Confirm installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem release-windows/RJP_Signer_Windows_Setup_*.exe
          if (!$files) { throw 'Installer EXE not found' }
          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows App artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Signer-Windows-App-NO-PUBLISH-V${{ steps.meta.outputs.version }}
          path: |
            release-windows/RJP_Signer_Windows_Setup_*.exe
            release-windows/RJP_Signer_Windows_Portable_*.zip
          if-no-files-found: error
