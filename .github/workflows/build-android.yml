name: Build Cavadas Manager Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf node_modules
          pnpm install --no-frozen-lockfile
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/cap

      - name: Build WebApp
        run: pnpm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Normalize Capacitor config
        shell: bash
        run: |
          set -euxo pipefail
          rm -f capacitor.config.ts capacitor.config.mjs capacitor.config.cjs
          test -f capacitor.config.json
          node -e "const c=require('./capacitor.config.json'); if(!c.appId||!c.appName||!c.webDir) process.exit(1); console.log('Capacitor config OK:', c.appId, c.appName, c.webDir)"

      - name: Prepare Android
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          test -f android/gradlew

      - name: Apply Cavadas Manager icons
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/apply-android-icons.cjs
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: Cavadas-Manager-V19.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
