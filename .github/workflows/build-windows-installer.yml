name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bridge/**'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Bridge Release x64
        shell: pwsh
        run: |
          msbuild bridge/RJP.Signer.Bridge/RJP.Signer.Bridge.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          & $iscc bridge/installer/RJP_Signer_Bridge.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Signer-Bridge-Setup-V1.2.1
          path: bridge/installer/output/RJP_Signer_Bridge_Setup_V1.2.1.exe
          if-no-files-found: error
